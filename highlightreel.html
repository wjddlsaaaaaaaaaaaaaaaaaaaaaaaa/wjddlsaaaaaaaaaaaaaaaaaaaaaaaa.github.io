<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  async function initHautePDF() {
    const canvasL = document.getElementById('haute-canvas-left');
    const canvasR = document.getElementById('haute-canvas-right');
    const ctxL    = canvasL.getContext('2d');
    const ctxR    = canvasR.getContext('2d');
    const counter = document.getElementById('haute-counter');
    let pdf       = null;
    let numPages  = 0;
    let spread    = 0;

    function spreadPages() {
      if (spread === 0) return [1, null];
      const left  = spread * 2;
      const right = left + 1;
      return [left, right <= numPages ? right : null];
    }

    function totalSpreads() {
      return 1 + Math.ceil((numPages - 1) / 2);
    }

    async function renderToCanvas(canvas, ctx, pageNum) {
      const p        = await pdf.getPage(pageNum);
      const dpr      = window.devicePixelRatio || 1;
      const viewport = p.getViewport({ scale: 1 });
      const scale    = (canvas.parentElement.clientWidth / 2 / viewport.width) * dpr;
      const scaled   = p.getViewport({ scale });

      canvas.width        = scaled.width;
      canvas.height       = scaled.height;
      canvas.style.width  = (scaled.width  / dpr) + 'px';
      canvas.style.height = (scaled.height / dpr) + 'px';

      await p.render({ canvasContext: ctx, viewport: scaled }).promise;
    }

    async function showSpread() {
      const [left, right] = spreadPages();
      await renderToCanvas(canvasL, ctxL, left);
      if (right) {
        canvasR.style.display = 'block';
        await renderToCanvas(canvasR, ctxR, right);
      } else {
        canvasR.style.display = 'none';
      }
      counter.textContent = `${spread + 1} / ${totalSpreads()}`;
    }

    document.getElementById('haute-prev').addEventListener('click', () => {
      if (spread > 0) { spread--; showSpread(); }
    });

    document.getElementById('haute-next').addEventListener('click', () => {
      if (spread < totalSpreads() - 1) { spread++; showSpread(); }
    });

    try {
      pdf      = await pdfjsLib.getDocument('/hautehighlightreel.pdf').promise;
      numPages = pdf.numPages;
      showSpread();
    } catch (e) {
      canvasL.style.display = 'none';
      canvasR.style.display = 'none';
      counter.textContent   = 'could not load pdf';
    }
  }

  initHautePDF();
</script>
