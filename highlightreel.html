      letter-spacing: 0.01em;

      color: #111;

      gap: 6rem;
    }

      color: #111;

    .project-media {

    }

      width: 100%;

    }

    .project-media video {
      width: 100%;
      display: block;
    }

    .project-media iframe {
      width: 100%;
      display: block;
      border: none;
    }

    .project-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .project-title {
      font-size: 0.85rem;
      letter-spacing: 0.01em;
    }

    .project-link {
      font-size: 0.75rem;
      color: #aaa;
      text-decoration: none;
      letter-spacing: 0.03em;
      transition: color 0.15s;
    }

    .project-link:hover { color: #111; }

    .project-date {
      font-size: 0.75rem;
      color: #aaa;
    }

    /* pdf viewer */
    .pdf-wrap {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .pdf-wrap canvas {

      display: block;
    }

    .pdf-controls {

      align-items: center;
      gap: 1.5rem;
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 0.05em;
    }

    .pdf-controls button {

      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.75rem;
      color: #aaa;
      padding: 0;
      transition: color 0.15s;
    }

    .pdf-controls button:hover { color: #111; }

    /* youtube shorts */
    .shorts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .shorts-row iframe {
      width: 100%;
      aspect-ratio: 9/16;
      border: none;
      display: block;
    }
  </style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  async function initPDF(url, canvasId, prevId, nextId, counterId) {
    const canvas  = document.getElementById(canvasId);
    const ctx     = canvas.getContext('2d');
    const counter = document.getElementById(counterId);
    let pdf = null;
    let page = 1;
    let numPages = 0;

    async function renderPage(num) {
      const p        = await pdf.getPage(num);
      const dpr      = window.devicePixelRatio || 1;
      const viewport = p.getViewport({ scale: 1 });
      const scale    = (canvas.parentElement.clientWidth / viewport.width) * dpr;
      const scaled   = p.getViewport({ scale });

      canvas.width        = scaled.width;
      canvas.height       = scaled.height;
      canvas.style.width  = (scaled.width  / dpr) + 'px';
      canvas.style.height = (scaled.height / dpr) + 'px';

      await p.render({ canvasContext: ctx, viewport: scaled }).promise;
      counter.textContent = `${num} / ${numPages}`;
    }

    document.getElementById(prevId).addEventListener('click', () => {
      if (page > 1) { page--; renderPage(page); }
    });

    document.getElementById(nextId).addEventListener('click', () => {
      if (page < numPages) { page++; renderPage(page); }
    });

    try {
      pdf      = await pdfjsLib.getDocument(url).promise;
      numPages = pdf.numPages;
      renderPage(page);
    } catch (e) {
      canvas.style.display = 'none';
      document.getElementById(counterId).textContent = 'could not load pdf';
    }
  }

  initPDF('/hautehighlightreel.pdf', 'haute-canvas', 'haute-prev', 'haute-next', 'haute-counter');
</script>
