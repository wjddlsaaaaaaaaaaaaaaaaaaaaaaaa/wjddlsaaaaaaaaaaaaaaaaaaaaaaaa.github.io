<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haute — Jennie Park</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #ffffff;
      font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.85rem;
      color: #111;
      overflow: hidden;
    }

    #nav {
      position: fixed;
      top: 2rem;
      left: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      z-index: 999;
    }

    #nav a {
      color: #111;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    #nav a:hover { opacity: 0.4; }

    #viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #spread {
      position: relative;
      height: 88vh;
      max-width: 94vw;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #spread img {
      height: 100%;
      width: auto;
      max-width: 94vw;
      object-fit: contain;
      display: block;
      box-shadow: 0 2px 24px rgba(0,0,0,0.08);
      transition: opacity 0.3s ease;
    }

    #spread img.hidden { opacity: 0; }

    .arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 1rem;
      font-size: 1rem;
      color: #111;
      opacity: 0.3;
      transition: opacity 0.15s;
      z-index: 999;
      font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
    }

    .arrow:hover { opacity: 1; }
    .arrow:disabled { opacity: 0.1; cursor: default; }

    #prev { left: 0.5rem; }
    #next { right: 0.5rem; }

    #counter {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: #999;
      letter-spacing: 0.05em;
      z-index: 999;
    }
  </style>
</head>
<body>

<nav id="nav">
  <a href="/main.html">home</a>
  <a href="/works.html">works</a>
</nav>

<div id="viewer">
  <div id="spread">
    <img id="page-img" src="" alt="" />
  </div>
</div>

<button class="arrow" id="prev">&#8592;</button>
<button class="arrow" id="next">&#8594;</button>
<div id="counter"></div>

<script>
  const TOTAL  = 64;
  const FOLDER = 'haute/';

  function imgSrc(n) {
    return FOLDER + (n === 1 ? 'HAUTEFINALPRINT.jpg' : 'HAUTEFINALPRINT' + n + '.jpg');
  }

  const img     = document.getElementById('page-img');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const counter = document.getElementById('counter');

  let current = 1;

  function render(n, dir) {
    img.classList.add('hidden');
    setTimeout(() => {
      img.src = imgSrc(n);
      img.alt = n === 1 ? 'Cover' : 'Spread ' + n;
      img.classList.remove('hidden');
    }, 280);

    counter.textContent = n === 1 ? 'cover' : n + ' / ' + TOTAL;
    prevBtn.disabled = n <= 1;
    nextBtn.disabled = n >= TOTAL;
  }

  function go(dir) {
    const next = current + dir;
    if (next < 1 || next > TOTAL) return;
    current = next;
    render(current, dir);
  }

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft')  go(-1);
  });

  // click left/right half of image to flip
  document.getElementById('viewer').addEventListener('click', e => {
    const mid = window.innerWidth / 2;
    if (e.clientX > mid) go(1); else go(-1);
  });

  // preload next image
  img.addEventListener('load', () => {
    if (current < TOTAL) new Image().src = imgSrc(current + 1);
  });

  render(1);
</script>
</body>
</html>
