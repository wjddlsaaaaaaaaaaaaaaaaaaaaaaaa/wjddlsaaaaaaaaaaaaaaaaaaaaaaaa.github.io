<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>haute***</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #ffffff;
      overflow: hidden;
      font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
    }

    #viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      max-height: 100vh;
    }

    #hit-left, #hit-right {
      position: fixed;
      top: 0;
      width: 50%;
      height: 100%;
      z-index: 10;
      cursor: pointer;
    }

    #hit-left  { left: 0; }
    #hit-right { right: 0; }

    #counter {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 0.05em;
      z-index: 20;
      pointer-events: none;
    }

    #pdf-link {
      position: fixed;
      bottom: 1.5rem;
      right: 2rem;
      font-size: 0.75rem;
      color: #aaa;
      letter-spacing: 0.05em;
      z-index: 20;
      text-decoration: none;
    }

    #pdf-link:hover { color: #111; }

    #nav {
      position: fixed;
      top: 2rem;
      left: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      z-index: 999;
      font-size: 0.85rem;
      letter-spacing: 0.01em;
      mix-blend-mode: multiply;
    }

    #nav a {
      color: #111;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    #nav a:hover { opacity: 0.4; }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      color: #aaa;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<nav id="nav">
  <a href="index.html">index</a>
  <a href="works.html">works</a>
  <a href="cv.html">cv</a>
</nav>

<div id="loading">loading...</div>
<div id="viewer"></div>
<div id="hit-left"></div>
<div id="hit-right"></div>
<div id="counter"></div>

<a href="https://drive.google.com/file/d/140Z9A4a7aymyHAfnQ2Y4jDAmaNroupMb/view?usp=sharing" target="_blank" id="pdf-link">view pdf</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const PDF_URL = '/HAUTEFINALPRINT.pdf';
  const viewer  = document.getElementById('viewer');
  const counter = document.getElementById('counter');
  const loading = document.getElementById('loading');

  let pdf      = null;
  let numPages = 0;
  let spread   = 0;

  function spreadPages() {
    if (spread === 0) return [1];
    const left  = spread * 2;
    const right = left + 1;
    return right <= numPages ? [left, right] : [left];
  }

  function totalSpreads() {
    return 1 + Math.ceil((numPages - 1) / 2);
  }

  async function renderPage(pageNum, maxH) {
    const page     = await pdf.getPage(pageNum);
    const viewport = page.getViewport({ scale: 1 });
    const scale    = (maxH / viewport.height) * 0.95;
    const scaled   = page.getViewport({ scale });

    const canvas  = document.createElement('canvas');
    canvas.width  = scaled.width;
    canvas.height = scaled.height;

    await page.render({
      canvasContext: canvas.getContext('2d'),
      viewport: scaled,
    }).promise;

    return canvas;
  }

  async function showSpread() {
    viewer.innerHTML = '';
    const pages    = spreadPages();
    const maxH     = window.innerHeight;
    const canvases = await Promise.all(pages.map(p => renderPage(p, maxH)));
    canvases.forEach(c => viewer.appendChild(c));
    counter.textContent = `${spread + 1} / ${totalSpreads()}`;
  }

  function prev() {
    if (spread > 0) { spread--; showSpread(); }
  }

  function next() {
    if (spread < totalSpreads() - 1) { spread++; showSpread(); }
  }

  document.getElementById('hit-left').addEventListener('click', prev);
  document.getElementById('hit-right').addEventListener('click', next);

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  prev();
    if (e.key === 'ArrowRight') next();
  });

  let touchX = null;
  document.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    if (touchX === null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    if (Math.abs(dx) > 40) { dx < 0 ? next() : prev(); }
    touchX = null;
  });

  (async () => {
    try {
      pdf      = await pdfjsLib.getDocument(PDF_URL).promise;
      numPages = pdf.numPages;
      loading.remove();
      showSpread();
    } catch (e) {
      loading.textContent = 'could not load pdf — check the file path';
    }
  })();
</script>
</body>
</html>
