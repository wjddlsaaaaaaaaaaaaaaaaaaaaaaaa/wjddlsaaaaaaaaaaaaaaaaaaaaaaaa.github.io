<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Haute — Jennie Park</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #ffffff;
      font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.85rem;
      color: #111;
      overflow: hidden;
    }

    #nav {
      position: fixed;
      top: 2rem;
      left: 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      z-index: 999;
    }

    #nav a {
      color: #111;
      text-decoration: none;
      transition: opacity 0.15s;
    }

    #nav a:hover { opacity: 0.4; }

    #viewer {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #canvas-container {
      position: relative;
      height: 88vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      height: 100%;
      width: auto;
      max-width: 94vw;
      box-shadow: 0 2px 24px rgba(0,0,0,0.08);
      transition: opacity 0.25s ease;
    }

    canvas.hidden { opacity: 0; }

    .arrow {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      padding: 1rem;
      font-size: 1rem;
      color: #111;
      opacity: 0.3;
      transition: opacity 0.15s;
      z-index: 999;
      font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
    }

    .arrow:hover { opacity: 1; }
    .arrow:disabled { opacity: 0.1; cursor: default; }

    #prev { left: 0.5rem; }
    #next { right: 0.5rem; }

    #counter {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: #999;
      letter-spacing: 0.05em;
      z-index: 999;
    }

    #pdf-link {
      position: fixed;
      top: 2rem;
      right: 2rem;
      font-family: Helvetica, 'Helvetica Neue', Arial, sans-serif;
      font-size: 0.85rem;
      color: #111;
      text-decoration: none;
      z-index: 999;
      transition: opacity 0.15s;
    }

    #pdf-link:hover { opacity: 0.4; }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #999;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

<nav id="nav">
  <a href="/">home</a>
  <a href="/works.html">works</a>
</nav>

<a href="https://drive.google.com/file/d/140Z9A4a7aymyHAfnQ2Y4jDAmaNroupMb/view?usp=sharing" target="_blank" id="pdf-link">view pdf</a>

<div id="loading">loading...</div>

<div id="viewer" style="display:none">
  <div id="canvas-container">
    <canvas id="pdf-canvas"></canvas>
  </div>
</div>

<button class="arrow" id="prev">&#8592;</button>
<button class="arrow" id="next">&#8594;</button>
<div id="counter"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const PDF_URL = 'HAUTEFINALPRINT.pdf';
  const canvas  = document.getElementById('pdf-canvas');
  const ctx     = canvas.getContext('2d');
  const prevBtn = document.getElementById('prev');
  const nextBtn = document.getElementById('next');
  const counter = document.getElementById('counter');
  const loading = document.getElementById('loading');
  const viewer  = document.getElementById('viewer');

  let pdfDoc   = null;
  let current  = 1;
  let rendering = false;

  async function renderPage(n) {
    if (rendering) return;
    rendering = true;

    canvas.classList.add('hidden');

    const page     = await pdfDoc.getPage(n);
    const viewport = page.getViewport({ scale: 2 });

    canvas.width  = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;

    canvas.classList.remove('hidden');
    rendering = false;

    counter.textContent = n + ' / ' + pdfDoc.numPages;
    prevBtn.disabled = n <= 1;
    nextBtn.disabled = n >= pdfDoc.numPages;

    // preload next
    if (n < pdfDoc.numPages) pdfDoc.getPage(n + 1);
  }

  async function go(dir) {
    const next = current + dir;
    if (next < 1 || next > pdfDoc.numPages) return;
    current = next;
    await renderPage(current);
  }

  prevBtn.addEventListener('click', () => go(-1));
  nextBtn.addEventListener('click', () => go(1));

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft')  go(-1);
  });

  document.getElementById('viewer').addEventListener('click', e => {
    const mid = window.innerWidth / 2;
    if (e.clientX > mid) go(1); else go(-1);
  });

  pdfjsLib.getDocument(PDF_URL).promise.then(pdf => {
    pdfDoc = pdf;
    loading.style.display = 'none';
    viewer.style.display  = 'flex';
    renderPage(1);
  });
</script>
</body>
</html>
